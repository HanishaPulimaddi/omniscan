name: Build and deploy Python app to Azure Web App - omniscanwebapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1️⃣ Checkout repo
      - uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3️⃣ Debug: verify backend structure
      - name: Verify backend files
        run: |
          ls -la
          ls -la backend

      # 4️⃣ Install backend dependencies (NO venv)
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5️⃣ Upload ONLY backend for deployment
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      # 6️⃣ Download artifact
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      # 7️⃣ Azure login
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E0B644F51504476E8E0639D41AD03B48 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_34E09C3977794B18B5FD78BAC2F74148 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6B0E9CED84444BCA83516D25CF26DE21 }}

      # 8️⃣ Deploy backend folder
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: omniscanwebapp
          slot-name: Production
          package: backend
