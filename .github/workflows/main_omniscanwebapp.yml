name: Build and deploy Python app to Azure Web App - omniscanwebapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3️⃣ Debug: verify backend structure
      - name: Verify backend files
        run: |
          ls -la
          ls -la backend

      # 4️⃣ Install backend dependencies
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5️⃣ Zip backend for deployment (CRITICAL FIX)
      - name: Create deployment package
        run: |
          cd backend
          zip -r ../app.zip .

      # 6️⃣ Upload ZIP artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      # 7️⃣ Download artifact
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      # 8️⃣ Deploy ZIP to Azure Web App (NO azure/login needed)
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: omniscanwebapp
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip
