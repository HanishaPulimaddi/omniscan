# Docs: https://github.com/Azure/webapps-deploy
# Python + Azure App Service (backend-in-subfolder)

name: Build and deploy Python app to Azure Web App - omniscanwebapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1️⃣ Checkout code
      - uses: actions/checkout@v4

      # 2️⃣ Set Python version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3️⃣ Install dependencies FROM backend folder
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Upload ONLY backend as deployment artifact
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            backend
            !backend/antenv

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      # 5️⃣ Download build artifact
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      # 6️⃣ Azure Login (OIDC)
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E0B644F51504476E8E0639D41AD03B48 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_34E09C3977794B18B5FD78BAC2F74148 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6B0E9CED84444BCA83516D25CF26DE21 }}

      # 7️⃣ Deploy backend folder to Azure App Service
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: omniscanwebapp
          slot-name: Production
          package: backend
