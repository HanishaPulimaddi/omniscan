services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: omniscan
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: omniscan
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniscan -d omniscan"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - omniscan_db_data:/var/lib/postgresql/data

  api:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Loads GROQ_API_KEY (and anything else) from the same .env the app
    # already uses outside Docker — not the host shell's environment, which
    # is what caused a stray/wrong GROQ_API_KEY to get baked in previously.
    env_file:
      - ./backend/.env
    environment:
      # Points at the `db` service on the compose network, using the same
      # credentials configured above — not the same as any host-side Postgres,
      # so this overrides whatever DATABASE_URL is in backend/.env.
      DATABASE_URL: postgresql://omniscan:localdev@db:5432/omniscan
      JWT_SECRET_KEY: localdevsecret
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # AWS_S3_BUCKET intentionally unset — local runs use disk storage, so
      # main.py's conditional /uploads mount stays active.

volumes:
  omniscan_db_data:
